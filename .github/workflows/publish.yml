name: Publish

# Publishes to npm when a version tag (v*) is pushed, through npm trusted
# publishing: GitHub's OIDC token authenticates the workflow, so no npm token is
# stored anywhere. Trusted publishing needs npm 11.5.1 or later.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack-smoke
      - name: Skip if this version is already on npm
        id: published
        run: node scripts/published-check.mjs
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
